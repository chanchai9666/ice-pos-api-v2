          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SyncBatchResponseWrapper"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: ส่งข้อมูลบิลขายออฟไลน์ขึ้นเซิร์ฟเวอร์ (Push Offline Sales Batch)
      tags:
        - Sync
  /sync/changes:
    get:
      description:
        ดึงข้อมูลสินค้าและหมวดหมู่ที่มีการเปลี่ยนแปลงตั้งแต่เวลาที่ระบุ
        สำหรับการซิงค์ข้อมูลกับเครื่อง POS ออฟไลน์
      parameters:
        - description: เวลาที่ซิงค์ล่าสุด (รูปแบบ RFC3339 เช่น 2026-01-01T00:00:00Z)
          in: query
          name: since
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SyncChangesResponseWrapper"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: ดึงข้อมูลอัพเดตแคตตาล็อก (Pull Catalog Changes)
      tags:
        - Sync
  /uploads/images:
    post:
      consumes:
        - multipart/form-data
      description:
        อัปโหลดไฟล์รูปภาพ (JPG, PNG, WEBP, GIF) รองรับขนาดสูงสุด 10MB ระบบจะทำการปรับขนาดและบีบอัดเป็น
        .webp อัตโนมัติให้มีขนาดไฟล์ไม่เกิน 50KB เพื่อความรวดเร็วในการโหลดและการซิงค์ข้อมูลออฟไลน์
      parameters:
        - description: ไฟล์รูปภาพที่ต้องการอัปโหลด (field 'file' หรือ 'image')
          in: formData
          name: file
          required: true
          type: file
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SuccessResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: อัปโหลดรูปภาพพร้อมปรับขนาดและแปลงเป็น WebP ขนาดไม่เกิน 50KB
      tags:
        - Products
  /users:
    get:
      description: ดึงข้อมูลรายชื่อผู้ใช้งานระบบทั้งหมด (เฉพาะสิทธิ์ Admin)
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.UserListDataResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: รายการผู้ใช้งานทั้งหมด
      tags:
        - Users
    post:
      consumes:
        - application/json
      description:
        ลงทะเบียนบัญชีพนักงานขายหน้าร้าน พร้อมชื่อผู้ใช้ รหัสผ่าน และรหัส
        PIN ด่วน (เฉพาะสิทธิ์ Admin)
      parameters:
        - description: ข้อมูลลงทะเบียนพนักงานแคชเชียร์
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.CreateCashierRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.UserDataResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: สร้างบัญชีพนักงานแคชเชียร์ใหม่
      tags:
        - Users
  /users/{id}/reset-pin:
    post:
      consumes:
        - application/json
      description: เปลี่ยนรหัส PIN ด่วนสำหรับพนักงานแคชเชียร์ (เฉพาะสิทธิ์ Admin)
      parameters:
        - description: รหัสผู้ใช้งาน (User ID / UUID)
          in: path
          name: id
          required: true
          type: string
        - description: รหัส PIN ใหม่ (ตัวเลข 4-6 หลัก)
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ResetPinRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.MessageResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: รีเซ็ตรหัส PIN พนักงานแคชเชียร์
      tags:
        - Users
schemes:
  - http
  - https
securityDefinitions:
  BearerAuth:
    description: 'ใส่ "Bearer " ตามด้วย JWT Token (ตัวอย่าง: ''Bearer eyJhbGci...'')'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
  - description: ระบบจัดการสิทธิ์และการเข้าสู่ระบบ
    name: Auth
  - description: ระบบจัดการข้อมูลสินค้าและแคตตาล็อก
    name: Products
  - description: ระบบจัดการหมวดหมู่สินค้า
    name: Categories
  - description: ระบบบันทึกการขาย ชำระเงิน และออกใบเสร็จรับเงิน
    name: Sales
  - description: ระบบรายงานยอดขายและสถิติสินค้าขายดี
    name: Reports
  - description: ระบบซิงค์ข้อมูลสำหรับรองรับการทำงานออฟไลน์ (Offline-first Synchronization)
    name: Sync
  - description: ระบบจัดการบัญชีผู้ใช้งานและพนักงานแคชเชียร์
    name: Users
  - description: ตรวจสอบสถานะความพร้อมและการทำงานของระบบ API
    name: Health
