basePath: /api/v1
definitions:
  ice-pos-api-v2_internal_domain.BestSellerItem:
    properties:
      product_code:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      total_qty_sold:
        type: integer
      total_revenue:
        description: Satang
        type: integer
    type: object
  ice-pos-api-v2_internal_domain.Category:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  ice-pos-api-v2_internal_domain.DailySalesSummary:
    properties:
      bill_count:
        type: integer
      date:
        type: string
      gross_profit:
        description: Satang
        type: integer
      total_cash_collected:
        description: Satang (Net sales collected)
        type: integer
      total_cost:
        description: Satang
        type: integer
      total_sales:
        description: Satang
        type: integer
      void_count:
        type: integer
    type: object
  ice-pos-api-v2_internal_domain.Product:
    properties:
      barcode:
        type: string
      category:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.Category"
      category_id:
        type: string
      code:
        type: string
      cost_price:
        description: Satang (for reporting only)
        type: integer
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        description: Satang
        type: integer
      updated_at:
        type: string
    type: object
  ice-pos-api-v2_internal_domain.Receipt:
    properties:
      cashier_name:
        type: string
      change:
        type: integer
      customer_name:
        type: string
      discount:
        type: integer
      grand_total:
        type: integer
      items:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.ReceiptItem"
        type: array
      occurred_at:
        type: string
      payment_method:
        type: string
      receipt_no:
        type: string
      sale_no:
        type: string
      status:
        type: string
      subtotal:
        type: integer
      tendered:
        type: integer
    type: object
  ice-pos-api-v2_internal_domain.ReceiptItem:
    properties:
      net_total:
        type: integer
      product_name:
        type: string
      qty:
        type: integer
      unit_price:
        type: integer
    type: object
  ice-pos-api-v2_internal_domain.Sale:
    properties:
      bill_discount:
        description: Satang
        type: integer
      cashier_id:
        type: string
      cashier_name:
        type: string
      change_amount:
        description: Satang (change calculated)
        type: integer
      created_at:
        type: string
      credit_amount:
        type: integer
      customer_id:
        type: string
      customer_name:
        type: string
      grand_total:
        description: Satang
        type: integer
      id:
        type: string
      lines:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.SaleItem"
        type: array
      occurred_at:
        type: string
      payment_method:
        type: string
      sale_no:
        type: string
      status:
        type: string
      subtotal:
        description: Satang
        type: integer
      tendered_amount:
        description: Satang (cash received)
        type: integer
      updated_at:
        type: string
      void_reason:
        type: string
      voided_at:
        type: string
    type: object
  ice-pos-api-v2_internal_domain.SaleItem:
    properties:
      cost_price:
        description: Satang (snapshot for profit calculation)
        type: integer
      gross_total:
        description: Satang
        type: integer
      id:
        type: string
      line_discount:
        description: Satang
        type: integer
      net_total:
        description: Satang
        type: integer
      product_code:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      qty:
        type: integer
      sale_id:
        type: string
      unit_price:
        description: Satang
        type: integer
    type: object
  ice-pos-api-v2_internal_domain.SyncBatchRequest:
    properties:
      sales:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.Sale"
        type: array
    type: object
  ice-pos-api-v2_internal_domain.SyncBatchResponse:
    properties:
      errors:
        items:
          type: string
        type: array
      failed_sales:
        type: integer
      skipped_sales:
        type: integer
      synced_sales:
        type: integer
    type: object
  ice-pos-api-v2_internal_domain.SyncChangesResponse:
    properties:
      categories:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.Category"
        type: array
      products:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.Product"
        type: array
      server_time:
        type: string
      since:
        type: string
    type: object
  ice-pos-api-v2_internal_domain.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  ice-pos-api-v2_internal_usecase.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      user:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.User"
    type: object
  internal_delivery_http_handler.AuthDataResponse:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_usecase.AuthResponse"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.BestSellersResponse:
    properties:
      data:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.BestSellerItem"
        type: array
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.CategoryListDataResponse:
    properties:
      data:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.Category"
        type: array
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.CheckoutData:
    properties:
      receipt:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.Receipt"
      sale:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.Sale"
    type: object
  internal_delivery_http_handler.CheckoutRequest:
    properties:
      bill_discount:
        example: 0
        type: integer
      customer_id:
        type: string
      lines:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.SaleItem"
        type: array
      payment_method:
        description: CASH หรือ CREDIT
        example: CASH
        type: string
      tendered_amount:
        example: 50000
        type: integer
    type: object
  internal_delivery_http_handler.CheckoutResponse:
    properties:
      data:
        $ref: "#/definitions/internal_delivery_http_handler.CheckoutData"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.CreateCashierRequest:
    properties:
      display_name:
        example: สมชาย แคชเชียร์
        type: string
      password:
        example: pass1234
        type: string
      pin:
        example: "1234"
        type: string
      username:
        example: cashier1
        type: string
    type: object
  internal_delivery_http_handler.CreateCustomerRequest:
    properties:
      credit_limit:
        type: integer
      email:
        example: somchai@example.com
        type: string
      initial_credit_limit:
        description: สตางค์
        example: 100000
        type: integer
      is_member:
        example: true
        type: boolean
      name:
        example: สมชาย ใจดี
        type: string
      phone:
        example: "0812345678"
        type: string
    type: object
  internal_delivery_http_handler.DailySummaryResponse:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.DailySalesSummary"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: คำขอไม่ถูกต้องหรือไม่พบข้อมูล
        type: string
      success:
        example: false
        type: boolean
    type: object
  internal_delivery_http_handler.HealthResponse:
    properties:
      service:
        example: ice-pos-api-v2
        type: string
      status:
        example: ok
        type: string
      version:
        example: 2.0.0
        type: string
    type: object
  internal_delivery_http_handler.LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        type: string
    type: object
  internal_delivery_http_handler.MeData:
    properties:
      role:
        example: ADMIN
        type: string
      user_id:
        example: usr_01hqxyz123
        type: string
      username:
        example: admin
        type: string
    type: object
  internal_delivery_http_handler.MeResponse:
    properties:
      data:
        $ref: "#/definitions/internal_delivery_http_handler.MeData"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.MessageResponse:
    properties:
      message:
        example: ดำเนินการสำเร็จ
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.PayCreditRequest:
    properties:
      amount:
        example: 50000
        type: integer
      idempotency_key:
        type: string
      note:
        example: ชำระหนี้ค้างรอบสัปดาห์
        type: string
      payment_method:
        example: CASH
        type: string
    type: object
  internal_delivery_http_handler.PinLoginRequest:
    properties:
      pin:
        example: "1234"
        type: string
    type: object
  internal_delivery_http_handler.ProductDataResponse:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.Product"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.ProductListDataResponse:
    properties:
      data:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.Product"
        type: array
      success:
        example: true
        type: boolean
      total:
        example: 42
        type: integer
    type: object
  internal_delivery_http_handler.ReceiptDataResponse:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.Receipt"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
      refreshToken:
        type: string
    type: object
  internal_delivery_http_handler.ResetPinRequest:
    properties:
      new_pin:
        example: "5678"
        type: string
    type: object
  internal_delivery_http_handler.SaleDataResponse:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.Sale"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.SaleListDataResponse:
    properties:
      data:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.Sale"
        type: array
      success:
        example: true
        type: boolean
      total:
        example: 100
        type: integer
    type: object
  internal_delivery_http_handler.SetCreditLimitRequest:
    properties:
      credit_limit:
        example: 200000
        type: integer
    type: object
  internal_delivery_http_handler.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.SyncBatchResponseWrapper:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.SyncBatchResponse"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.SyncChangesResponseWrapper:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.SyncChangesResponse"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.UpdateCustomerRequest:
    properties:
      email:
        type: string
      is_member:
        type: boolean
      name:
        example: สมชาย ใจดีมาก
        type: string
      phone:
        type: string
    type: object
  internal_delivery_http_handler.UserDataResponse:
    properties:
      data:
        $ref: "#/definitions/ice-pos-api-v2_internal_domain.User"
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.UserListDataResponse:
    properties:
      data:
        items:
          $ref: "#/definitions/ice-pos-api-v2_internal_domain.User"
        type: array
      success:
        example: true
        type: boolean
    type: object
  internal_delivery_http_handler.VoidSaleRequest:
    properties:
      reason:
        example: ลูกค้าเปลี่ยนใจ / คีย์รายการผิด
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@ice-pos.local
    name: ทีมพัฒนา ICE POS
  description:
    ระบบ REST API สำหรับระบบขายหน้าร้าน (POS) ประสิทธิภาพสูง พร้อมรองรับการทำงานออฟไลน์
    (Offline-first Synchronization)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: ICE POS API v2
  version: "2.0"
paths:
  /auth/login:
    post:
      consumes:
        - application/json
      description:
        ยืนยันตัวตนผู้ใช้งานด้วยชื่อผู้ใช้และรหัสผ่าน เพื่อรับ JWT access
        token และ refresh token
      parameters:
        - description: ข้อมูลเข้าสู่ระบบ (Username และ Password)
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.LoginRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.AuthDataResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      summary: เข้าสู่ระบบด้วย Username & Password
      tags:
        - Auth
  /auth/logout:
    post:
      description: ออกจากระบบและสั่งให้เบราว์เซอร์ทำลายคุกกี้ access_token และ refresh_token
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SuccessResponse"
      summary: ออกจากระบบและล้างคุกกี้ (Logout)
      tags:
        - Auth
  /auth/me:
    get:
      description: ดึงข้อมูลโปรไฟล์และบทบาทของผู้ใช้งานที่กำลังเข้าสู่ระบบผ่าน Token
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.MeResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: ดูข้อมูลโปรไฟล์ผู้ใช้งานปัจจุบัน
      tags:
        - Auth
  /auth/pin-login:
    post:
      consumes:
        - application/json
      description: เข้าสู่ระบบด่วนสำหรับพนักงานขายหน้าร้านด้วยรหัสตัวเลข PIN 4-6 หลัก
      parameters:
        - description: รหัส PIN พนักงานแคชเชียร์
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.PinLoginRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.AuthDataResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      summary: เข้าสู่ระบบด่วนด้วย PIN (สำหรับพนักงานแคชเชียร์)
      tags:
        - Auth
  /auth/refresh:
    post:
      consumes:
        - application/json
      description:
        รับ Access Token และ Refresh Token ชุดใหม่โดยใช้ Refresh Token
        ที่ยังไม่หมดอายุ (รองรับทั้ง Cookie refresh_token และ JSON Body)
      parameters:
        - description: Payload สำหรับต่ออายุ Token (ไม่จำเป็นหากส่งผ่าน Cookie)
          in: body
          name: request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.RefreshTokenRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.AuthDataResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      summary: ขอต่ออายุ Access Token (Refresh Token)
      tags:
        - Auth
  /categories:
    get:
      description: ดึงรายการหมวดหมู่สินค้าทั้งหมดที่มีในระบบ
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.CategoryListDataResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      summary: รายการหมวดหมู่สินค้าทั้งหมด
      tags:
        - Categories
  /customers:
    get:
      description: ดึงรายการลูกค้าทั้งหมด พร้อมแสดงวงเงินเครดิต ยอดหนี้คงค้าง และคะแนนสะสม
      parameters:
        - description: ค้นหาจากชื่อ เบอร์โทร หรืออีเมล
          in: query
          name: search
          type: string
        - description: กรองเฉพาะสมาชิก (true/false)
          in: query
          name: is_member
          type: boolean
        - description: หน้าที่ต้องการ (เริ่มต้น 1)
          in: query
          name: page
          type: integer
        - description: จำนวนรายการต่อหน้า (เริ่มต้น 20, สูงสุด 100)
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SuccessResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: ดูรายการลูกค้าและยอดค้างชำระ
      tags:
        - Customers
    post:
      consumes:
        - application/json
      description: เพิ่มข้อมูลลูกค้าใหม่ สมาชิก และกำหนดวงเงินเครดิตเริ่มต้น (หน่วยสตางค์)
      parameters:
        - description: ข้อมูลสำหรับสร้างลูกค้า
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.CreateCustomerRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SuccessResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: ลงทะเบียนลูกค้าใหม่และเปิดบัญชีเงินเชื่อ
      tags:
        - Customers
  /customers/{id}:
    delete:
      description: ลบข้อมูลลูกค้า (ไม่อนุญาตให้ลบหากยังมียอดหนี้คงค้างในบัญชีเงินเชื่อ)
      parameters:
        - description: Customer UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SuccessResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.ErrorResponse"
      security:
        - BearerAuth: []
      summary: ลบข้อมูลลูกค้า (Soft Delete)
      tags:
        - Customers
    get:
      description: ดึงข้อมูลโปรไฟล์ลูกค้า สถานะวงเงินเครดิต และยอดหนี้คงค้าง
      parameters:
        - description: Customer UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/internal_delivery_http_handler.SuccessResponse"
        "401":
          description: Unauthorized
          schema:
